name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run health
      - name: Check that the tag names the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Pack the tarball and its SHA-256
        id: pack
        run: |
          file="$(npm pack --ignore-scripts --json | node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync(0, 'utf8'))[0].filename)")"
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f 1 "$file.sha256")" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$FILE"
          printf 'Install:\n\n```sh\nnpm install %s\n```\n\nSHA-256 of `%s`: `%s`\n\nSee CHANGELOG.md for the changes in this release.\n' "$url" "$FILE" "$SHA256" > notes.md
          gh release create "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256" $prerelease --title "$GITHUB_REF_NAME" --notes-file notes.md
