name: SDK health
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The engines floor (require(esm) unflagged), the workspace version, and the newest 24.x.
        node-version: [22.12.0, 24.18.0, 24.x]
    steps:
      # Actions are pinned by full commit SHA; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run health
      # The documented Git install builds through `prepare`; prove it from a clean commit.
      - run: npm run test:git-install
