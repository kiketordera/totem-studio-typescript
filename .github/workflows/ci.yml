name: SDK health
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The engines floor (require(esm) unflagged), the workspace version, and the newest 24.x.
        node-version: [22.12.0, 24.18.0, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run health
      # The documented Git install builds through `prepare`; prove it from a clean commit.
      - run: npm run test:git-install
